openapi: 3.0.0
info:
  title: Календарь звонков
  version: 1.0.0
  description: |-
    Сервис бронирования календаря звонков.

    Авторизации нет ни на одном маршруте: «владелец» и «гость» — роли интерфейса,
    а не аккаунты. Все маршруты живут под префиксом `/api`, тело — JSON,
    имена полей — camelCase.

    Технический `GET /health` — проба готовности вне `/api`; в контракт он не
    входит и единый конверт ошибки на него не распространяется.
tags:
  - name: Брони
    description: Брони гостей на слоты типов событий.
  - name: Слоты
    description: Сетка слотов типа события на окно записи.
  - name: Типы событий
    description: Типы событий — шаблоны, по которым нарезаются слоты.
paths:
  /api/bookings:
    post:
      operationId: Bookings_create
      summary: Создание брони
      description: 'Занятость сквозная по типам: пересечение интервалов даёт `409 slot_taken`.'
      parameters: []
      responses:
        '201':
          description: Созданный ресурс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Поля тела не прошли правила валидации
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/InvalidJsonErrorResponse'
        '404':
          description: Тип события с таким `id` не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeNotFoundErrorResponse'
        '409':
          description: Слот пересекается с существующей бронью
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotTakenErrorResponse'
        '500':
          description: Непредвиденная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
      tags:
        - Брони
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
    get:
      operationId: Bookings_list
      summary: Предстоящие брони
      description: 'Роль — интерфейс, а не доступ: список одинаков для гостя и владельца.'
      parameters: []
      responses:
        '200':
          description: Только будущие брони, по возрастанию `date`, затем `start`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '500':
          description: Непредвиденная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
      tags:
        - Брони
  /api/event-types:
    get:
      operationId: EventTypes_list
      summary: Список типов событий
      description: Порядок вывода — по `id`. Пустая база — пустой список.
      parameters: []
      responses:
        '200':
          description: 'Все типы событий; пустая база — `{ "eventTypes": [] }`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeListResponse'
        '500':
          description: Непредвиденная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
      tags:
        - Типы событий
    post:
      operationId: EventTypes_create
      summary: Создание типа события
      description: Идентификатор генерирует система. Редактирования и удаления типов нет.
      parameters: []
      responses:
        '201':
          description: Созданный ресурс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeResponse'
        '400':
          description: Поля тела не прошли правила валидации
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/InvalidJsonErrorResponse'
        '500':
          description: Непредвиденная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
      tags:
        - Типы событий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreate'
  /api/event-types/{id}/slots:
    get:
      operationId: EventTypeSlots_list
      summary: Сетка слотов типа события
      description: Окно записи — константа `[сегодня … сегодня + 13]`; нецелый `:id` — тоже `404`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Все 14 дней окна с сетами слотов типа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotsResponse'
        '404':
          description: Тип события с таким `id` не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeNotFoundErrorResponse'
        '500':
          description: Непредвиденная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
      tags:
        - Слоты
security:
  - {}
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - date
        - start
        - end
        - guestName
        - guestEmail
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
          description: Тип события, по которому бронировали
        date:
          $ref: '#/components/schemas/LocalDate'
        start:
          $ref: '#/components/schemas/LocalTime'
        end:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: Вычисляется из `start` и снимка длительности брони
        guestName:
          type: string
          maxLength: 100
          description: Имя гостя, непустое после trim, ≤ 100 символов
        guestEmail:
          type: string
          maxLength: 254
          description: Email гостя, базовая проверка формата, ≤ 254 символов
        createdAt:
          type: string
          format: date-time
          description: Момент создания брони
      description: |-
        Бронь, созданная гостем. Длительность и интервал берутся из снимка брони,
        `eventTypeName` в ответе нет — гость знает тип, с которого пришёл.
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - date
        - start
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: integer
          format: int32
          description: Тип события; тип должен существовать, иначе 404 event_type_not_found
        date:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: Дата в окне записи `[сегодня … сегодня + 13]`
        start:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: Начало, совпадает с реальным слотом этого типа и не в прошлом
        guestName:
          type: string
          maxLength: 100
          description: Имя гостя, непустое после trim, ≤ 100 символов
        guestEmail:
          type: string
          maxLength: 254
          description: Email гостя, базовая проверка формата, ≤ 254 символов
      description: Тело `POST /api/bookings`
    BookingListItem:
      type: object
      required:
        - id
        - date
        - start
        - end
        - eventTypeName
        - guestName
        - guestEmail
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        date:
          $ref: '#/components/schemas/LocalDate'
        start:
          $ref: '#/components/schemas/LocalTime'
        end:
          $ref: '#/components/schemas/LocalTime'
        eventTypeName:
          type: string
          description: Имя типа события — join по `event_type_id`
        guestName:
          type: string
        guestEmail:
          type: string
        createdAt:
          type: string
          format: date-time
      description: |-
        Строка списка предстоящих броней. Отличается от `Booking`: вместо
        `eventTypeId` приходит имя типа (join по `event_type_id`).
    BookingListResponse:
      type: object
      required:
        - bookings
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingListItem'
    BookingResponse:
      type: object
      required:
        - booking
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
    Day:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Все слоты типа на дату, включая занятые и прошедшие
      description: 'День окна записи: дата и сетка слотов типа на неё'
    EventType:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: integer
          format: int32
          description: Идентификатор, генерирует система
        name:
          type: string
          maxLength: 100
          description: Название, непустое после trim, ≤ 100 символов
        description:
          type: string
          maxLength: 1000
          description: Описание, ≤ 1000 символов; по умолчанию пустая строка
      description: |-
        Тип события — шаблон, по которому нарезаются слоты. Состав полей — ровно
        три: идентификатор, название, описание. Длительность слота — константа
        30 минут (`SLOT_MINUTES`), в типе события не хранится.
    EventTypeCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          description: Название, непустое после trim, ≤ 100 символов
        description:
          type: string
          maxLength: 1000
          description: Описание, ≤ 1000 символов
          default: ''
      description: Тело `POST /api/event-types`. Идентификатор генерирует система — в теле его нет.
    EventTypeListResponse:
      type: object
      required:
        - eventTypes
      properties:
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
          description: Все типы событий, порядок по `id`; пустая база — пустой массив
    EventTypeNotFoundErrorBody:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: number
          enum:
            - 404
          description: HTTP-статус, продублирован в теле ответа
        code:
          type: string
          enum:
            - event_type_not_found
          description: Машинный код — есть всегда
        message:
          type: string
          description: Человекочитаемый текст (русский)
      description: |-
        Тело ошибки: `status` дублирует HTTP-статус, `code` — машинный код, по которому
        ветвится клиент, `message` — человекочитаемый текст.
    EventTypeNotFoundErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/EventTypeNotFoundErrorBody'
      description: 'Конверт ошибки: тело ответа — объект с единственным ключом `error`'
    EventTypeResponse:
      type: object
      required:
        - eventType
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Имя поля из тела запроса
        message:
          type: string
          description: Человекочитаемое объяснение
      description: Ошибка валидации одного поля тела запроса
    InternalErrorBody:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: number
          enum:
            - 500
          description: HTTP-статус, продублирован в теле ответа
        code:
          type: string
          enum:
            - internal_error
          description: Машинный код — есть всегда
        message:
          type: string
          description: Человекочитаемый текст (русский)
      description: |-
        Тело ошибки: `status` дублирует HTTP-статус, `code` — машинный код, по которому
        ветвится клиент, `message` — человекочитаемый текст.
    InternalErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/InternalErrorBody'
      description: 'Конверт ошибки: тело ответа — объект с единственным ключом `error`'
    InvalidJsonErrorBody:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: number
          enum:
            - 400
          description: HTTP-статус, продублирован в теле ответа
        code:
          type: string
          enum:
            - invalid_json
          description: Машинный код — есть всегда
        message:
          type: string
          description: Человекочитаемый текст (русский)
      description: |-
        Тело ошибки: `status` дублирует HTTP-статус, `code` — машинный код, по которому
        ветвится клиент, `message` — человекочитаемый текст.
    InvalidJsonErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/InvalidJsonErrorBody'
      description: 'Конверт ошибки: тело ответа — объект с единственным ключом `error`'
    LocalDate:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: Календарная дата, `YYYY-MM-DD`
    LocalTime:
      type: string
      pattern: ^([01]\d|2[0-3]):[0-5]\d$
      description: Время суток, `HH:MM`
    Slot:
      type: object
      required:
        - start
        - end
        - available
      properties:
        start:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: Начало слота на сетке типа
        end:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: Конец слота — `start` плюс длительность типа
        available:
          type: boolean
          description: |-
            Свободен по единственному определению: интервал не пересекается ни с одной
            бронью и слот не в прошлом (для сегодня — начало строго в будущем).
            Занятые и прошедшие слоты остаются в сетке с `false`.
      description: |-
        Слот — полуоткрытый интервал `[start, end)` внутри рабочего дня 09:00–18:00.
        Длительность слота всегда равна длительности типа; неполный остаток у правого
        края слотом не является и в сетке не появляется.
    SlotTakenErrorBody:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: number
          enum:
            - 409
          description: HTTP-статус, продублирован в теле ответа
        code:
          type: string
          enum:
            - slot_taken
          description: Машинный код — есть всегда
        message:
          type: string
          description: Человекочитаемый текст (русский)
      description: |-
        Тело ошибки: `status` дублирует HTTP-статус, `code` — машинный код, по которому
        ветвится клиент, `message` — человекочитаемый текст.
    SlotTakenErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/SlotTakenErrorBody'
      description: 'Конверт ошибки: тело ответа — объект с единственным ключом `error`'
    SlotsResponse:
      type: object
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/Day'
    ValidationErrorBody:
      type: object
      required:
        - status
        - code
        - message
        - details
      properties:
        status:
          type: number
          enum:
            - 400
        code:
          type: string
          enum:
            - validation_error
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Собрано по всем невалидным полям разом, а не по первому
    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ValidationErrorBody'
      description: 'Конверт ошибки: тело ответа — объект с единственным ключом `error`'
servers:
  - url: http://localhost:3000
    description: Локальная разработка
    variables: {}
