# Blueprint Render: два сервиса из одного репозитория.
#
# Бэкенд (server/) — Node Web Service; фронтенд (client/) — Static Site.
# Контракт (api/) не деплоится: openapi.yaml и оба generated/ закоммичены,
# генерацию на Render запускать не нужно.
#
# Free-план намеренно без persistent disk: файловая система Render эфемерна,
# поэтому SQLite (node:sqlite) пересоздаётся пустой при каждом деплое,
# рестарте и засыпании инстанса. Данные типов событий и броней не сохраняются.
# Чтобы данные выживали — см. комментарий в конце файла.

services:
  - type: web
    name: call-calendar-api
    runtime: node
    plan: free
    rootDir: server
    # devDeps (oxlint, yaml) в рантайме не нужны — только ajv и express
    # из dependencies. Отдельного шага сборки нет: артефакты закоммичены.
    buildCommand: npm ci --omit=dev
    # Схема идемпотентна (CREATE TABLE IF NOT EXISTS), поэтому применяется
    # на каждом старте до запуска сервера — как в CMD корневого Dockerfile.
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # node:sqlite требует Node 24; Render по умолчанию уже даёт 24.x,
      # но фиксируем явно, чтобы версия не «поехала» с обновлением платформы.
      - key: NODE_VERSION
        value: "24"
      # PORT не задаём: Render инжектит его сам, config.js читает process.env.PORT.
      - key: DB_PATH
        value: ./data/prod.db

  - type: web
    name: call-calendar-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Запросы клиента к /api/... уходят на бэкенд тем же origin через rewrite
    # (серверный прокси), поэтому CORS не нужен — как и в dev-прокси Vite.
    # destination следует за именем сервиса выше; при смене имени обновите URL.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://call-calendar-api.onrender.com/api/*

# Чтобы данные SQLite переживали деплои, бэкенд нужно перевести на plan: starter
# и добавить в его блок:
#
#     disk:
#       name: call-calendar-data
#       mountPath: /opt/render/project/src/storage
#       sizeGB: 1
#
# и заменить DB_PATH на /opt/render/project/src/storage/prod.db.
